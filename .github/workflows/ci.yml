name: CI - Tests and quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api:
    name: API - Lint, typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: api
        run: npm run db:generate

      - name: Create test environment file
        working-directory: api
        run: |
          mkdir -p tests/config
          cat > tests/config/.env.test << 'EOF_TEST'
          NODE_ENV=test
          PORT=7357
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=petfosterconnecttest
          POSTGRES_PORT=5437
          DATABASE_URL=postgresql://postgres:postgres@localhost:5437/petfosterconnecttest
          ACCESS_TOKEN_SECRET=test-access-token-secret
          ALLOWED_ORIGINS=http://localhost:5173
          LOG_LEVEL=error
          EOF_TEST

      - name: Run API lint
        working-directory: api
        run: npm run lint

      - name: Run API typecheck
        working-directory: api
        run: npm run typecheck

      - name: Run API tests
        working-directory: api
        run: npm test

  frontend:
    name: Frontend - Lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install frontend dependencies
        working-directory: cli
        run: npm ci

      - name: Run frontend lint
        working-directory: cli
        run: npm run lint

      - name: Run frontend tests
        working-directory: cli
        run: npm test

      - name: Build frontend
        working-directory: cli
        run: npm run build